<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join {{ code }} - Aurora Play</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 30% 10%, #2a1458 0%, #0a0a14 60%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; padding: 24px 16px;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: 0.5px;
         background: linear-gradient(90deg, #a855f7, #22d3ee); -webkit-background-clip: text;
         background-clip: text; color: transparent; }
    .sub { color: rgba(255,255,255,0.55); margin: 0 0 28px; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.45); }
    .code { font: 800 56px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 10px;
            margin: 8px 0 28px; padding: 18px 0; border-radius: 18px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); }
    .btn { display: block; width: 100%; padding: 18px; border-radius: 16px; border: 0;
           font-size: 18px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .primary { background: linear-gradient(90deg, #a855f7, #22d3ee); color: #fff; }
    .ghost { margin-top: 12px; background: rgba(255,255,255,0.08); color: #fff; }
    ol { text-align: left; color: rgba(255,255,255,0.65); line-height: 1.6; padding-left: 22px; margin: 28px 0 0; }
    .copied { color: #4ade80; font-size: 14px; min-height: 20px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Aurora Play</h1>
    <p class="sub">You're invited to a game on the TV</p>
    <div class="label">ROOM CODE</div>
    <div class="code" id="code">{{ code }}</div>
    <a class="btn primary" id="open" href="{{ app_url }}">Open in Aurora Play</a>
    <button class="btn ghost" id="copy" type="button">Copy code</button>
    <div class="copied" id="copied" aria-live="polite"></div>
    <ol>
      <li>Open the <strong>Aurora Play</strong> app on your phone.</li>
      <li>The code fills in automatically. If not, type <strong>{{ code }}</strong>.</li>
      <li>Enter your name and tap <strong>Join Game</strong>.</li>
    </ol>
  </main>
  <script>
    (function () {
      var appUrl = {{ app_url|tojson }};
      // Try the app straight away; if it isn't installed the page simply stays.
      setTimeout(function () { window.location.href = appUrl; }, 300);
      document.getElementById("copy").addEventListener("click", function () {
        var code = {{ code|tojson }};
        var done = function () { document.getElementById("copied").textContent = "Copied " + code; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, done);
        } else {
          done();
        }
      });
    })();
  </script>
</body>
</html>
