name: Security scans

# Static analysis, dependency audit and secret scan for the backend. Runs on
# every PR and push, and weekly so a newly published advisory against a pinned
# dependency shows up without anyone touching the code.
#
# Code scanning (CodeQL) is separate: GitHub's default setup covers Python,
# JavaScript and Actions, and can add Swift (Settings, Code security).
# The dynamic scan lives in dast.yml.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Static analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit==1.9.4
      - name: Scan the backend
        # Medium severity and up. Every finding is either fixed or carries a
        # reviewed `# nosec <id> - reason` on its line.
        run: bandit -r . -x ./tests,./ios,./static,./node_modules,./docs -ll -f txt -o bandit.txt || (cat bandit.txt; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit.txt
          if-no-files-found: ignore

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.9.0
      - name: Audit pinned runtime dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the whole history: a secret removed later is still leaked
      - name: Scan history
        run: |
          VERSION=8.24.2
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact -v --no-banner --exit-code 1
