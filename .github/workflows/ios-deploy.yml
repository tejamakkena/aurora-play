name: iOS + tvOS → TestFlight

on:
  push:
    branches: [main]
    paths: ["ios/**"]          # only runs when Swift code changes
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-deploy.yml"   # build-check below is gated on
                                              # this event; without this line
                                              # a PR that only edits this file
                                              # never triggers its own check
  workflow_dispatch:           # manual trigger from GitHub Actions tab
    inputs:
      target:
        description: "Which app to deploy"
        required: true
        default: "both"
        type: choice
        options: [both, ios, tvos]

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build check on every PR (no signing, no upload) ────────────────────────
  build-check:
    name: Build check (simulator)
    runs-on: macos-26
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # A freshly xcode-select'd non-default Xcode copy may never have run
      # Apple's first-launch initialization (accepting the license,
      # registering with CoreSimulator); without it, -downloadPlatform fails
      # with "Unable to connect to simulator" rather than downloading
      # anything.
      - name: Run Xcode first launch
        run: sudo xcodebuild -runFirstLaunch

      # Explicitly download both platforms rather than assuming either is
      # already present. This runner image's VM instances are not
      # consistent about what's pre-cached: an earlier iteration of this
      # workflow reordered the iOS build ahead of the tvOS platform install,
      # on the theory that installing tvOS was transiently breaking iOS's
      # own destination resolution right after -- but a later run failed on
      # "iOS 18.2 is not installed" with the iOS build running first and no
      # tvOS steps having touched anything yet, disproving that theory. The
      # simpler, correct explanation: some VM instances just don't have iOS
      # Simulator cached by default, the same as tvOS. -downloadPlatform is
      # a no-op when the platform is already present, so doing this for both
      # unconditionally costs nothing on instances where it's cached, and
      # fixes the build on instances where it isn't.
      - name: Install iOS platform
        run: |
          for attempt in 1 2 3 4 5 6; do
            sudo xcodebuild -downloadPlatform iOS && exit 0
            echo "Attempt $attempt failed (often a transient CoreSimulator connection race) -- retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Install tvOS platform
        run: |
          for attempt in 1 2 3 4 5 6; do
            sudo xcodebuild -downloadPlatform tvOS && exit 0
            echo "Attempt $attempt failed (often a transient CoreSimulator connection race) -- retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM packages
        run: xcodebuild -resolvePackageDependencies -project GameLab.xcodeproj -scheme GameLabController

      - name: Build iOS (simulator, no signing)
        run: |
          xcodebuild build \
            -project GameLab.xcodeproj \
            -scheme GameLabController \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build tvOS (simulator, no signing)
        run: |
          # generic/platform=tvOS Simulator failed here: this runner image
          # has no tvOS Simulator runtime installed ("tvOS 18.2 is not
          # installed"), unlike the iOS Simulator destination above, which
          # resolved fine. generic/platform=tvOS is the device-generic form
          # already proven working for this exact scheme in deploy-tvos's
          # archive step -- it needs only the tvOS SDK (bundled with Xcode),
          # never a separately-installed runtime, which is all a
          # compile-only check needs.
          xcodebuild build \
            -project GameLab.xcodeproj \
            -scheme GameLabTV \
            -configuration Debug \
            -destination generic/platform=tvOS \
            CODE_SIGNING_ALLOWED=NO

  # ── tvOS UI test: does Select/Play-Pause actually fire a game card's action? ─
  # Unlike build-check's tvOS step above (generic/platform=tvOS, which is a
  # device-generic destination with no instantiated Simulator and so cannot
  # run tests), this targets a real "platform=tvOS Simulator" destination
  # with `xcodebuild test`, running GameLabTVUITests -- which answers,
  # automatically and on every PR, the exact question 15 rounds of manual
  # on-device testing were spent chasing: does a Siri Remote Select (or
  # Play/Pause) press reach `pick(_:)` in TVGameSelectionView at all. See
  # that view's `#if DEBUG`-only debugLastInput diagnostic, which the test
  # reads.
  tv-ui-test:
    name: tvOS UI test (Select/Play-Pause reach pick(_:)?)
    runs-on: macos-26
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # See build-check's identical step for why this is needed: a freshly
      # xcode-select'd non-default Xcode copy may never have run Apple's
      # first-launch initialization, and -downloadPlatform fails with
      # "Unable to connect to simulator" without it.
      - name: Run Xcode first launch
        run: sudo xcodebuild -runFirstLaunch

      # Unlike build-check's tvOS build (which only needs the SDK, bundled
      # with Xcode, via generic/platform=tvOS), running tests needs an
      # actual tvOS Simulator *runtime* installed -- so this step isn't
      # optional here the way it effectively is for build-check's tvOS leg.
      # Mirrors build-check's retry loop: this runner image's VM instances
      # are inconsistent about what's pre-cached, and -downloadPlatform is a
      # no-op when the platform is already present.
      - name: Install tvOS platform
        run: |
          for attempt in 1 2 3 4 5 6; do
            sudo xcodebuild -downloadPlatform tvOS && exit 0
            echo "Attempt $attempt failed (often a transient CoreSimulator connection race) -- retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM packages
        run: xcodebuild -resolvePackageDependencies -project GameLab.xcodeproj -scheme GameLabTV

      # Debugging aid if the destination below doesn't resolve on this
      # runner image: lists every Simulator device/OS combination actually
      # available, so a failure here points straight at a real device name
      # to use instead of "Apple TV" guessed below.
      - name: List available Simulators
        run: xcrun simctl list devices available

      - name: Run tvOS UI tests (Simulator)
        run: |
          xcodebuild test \
            -project GameLab.xcodeproj \
            -scheme GameLabTV \
            -destination 'platform=tvOS Simulator,name=Apple TV' \
            -only-testing:GameLabTVUITests \
            -resultBundlePath TVUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # When the app crashes under test, XCTest only says "crashed in
      # <external symbol>". Print the crash report itself so the failing
      # frame is in the log, and keep the result bundle for a closer look.
      - name: Show tvOS app crash reports
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for f in ~/Library/Logs/DiagnosticReports/GameLabTV*.ips ~/Library/Logs/DiagnosticReports/*/GameLabTV*.ips; do
            found=1
            echo "===== $f"
            python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          header, _, body = raw.partition("\n")
          try:
              report = json.loads(body)
          except ValueError:
              print(raw[:6000]); sys.exit()
          exc = report.get("exception", {})
          print("exception:", exc.get("type"), exc.get("signal"), exc.get("subtype", ""))
          for line in (report.get("asi") or {}).values():
              print("asi:", line)
          images = report.get("usedImages", [])
          for t in report.get("threads", []):
              if not t.get("triggered"):
                  continue
              print("crashed thread:", t.get("name", ""), t.get("queue", ""))
              for fr in t.get("frames", [])[:40]:
                  img = images[fr.get("imageIndex", 0)].get("name", "?") if images else "?"
                  print("  ", img, fr.get("symbol", hex(fr.get("imageOffset", 0))))
          PY
          done
          [ "$found" = 1 ] || echo "No GameLabTV crash report found."

      - name: Keep the UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-ui-test-results
          path: ios/TVUITests.xcresult
          retention-days: 7

  # ── Deploy iOS controller app to TestFlight ─────────────────────────────────
  deploy-ios:
    name: Deploy iOS → TestFlight
    runs-on: macos-26
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'both' || github.event.inputs.target == 'ios'))
    defaults:
      run:
        working-directory: ios
    environment: testflight       # requires approval in GitHub environments (optional)

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # See build-check's identical steps for why: this runner's VM
      # instances are inconsistent about pre-cached platform support, and
      # -downloadPlatform is a no-op when already present.
      - name: Run Xcode first launch
        run: sudo xcodebuild -runFirstLaunch

      - name: Install iOS platform
        run: |
          for attempt in 1 2 3 4 5 6; do
            sudo xcodebuild -downloadPlatform iOS && exit 0
            echo "Attempt $attempt failed (often a transient CoreSimulator connection race) -- retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ── Code signing ──────────────────────────────────────────────────────
      - name: Install Apple Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/dist.p12

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import distribution certificate. No -t: the p12 bundles both the
          # certificate and its private key, and forcing -t cert makes
          # security import keep only the certificate, silently dropping the
          # key -- the next command then finds no identity to authorize.
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install iOS provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/ios.mobileprovision
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          # Extract UUID for later reference
          PROFILE_UUID=$(security cms -D -i "$PP_PATH" | \
            plutil -extract UUID raw -)
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      # ── Build & Archive ───────────────────────────────────────────────────
      - name: Set build number
        run: |
          agvtool new-version -all ${{ github.run_number }}

      - name: Archive iOS app
        env:
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild archive \
            -project GameLab.xcodeproj \
            -scheme GameLabController \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/GameLabController.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISION_PROFILE_NAME"

      - name: Export IPA
        env:
          IOS_PROVISION_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > $RUNNER_TEMP/ios-export.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.gamelab.controller</key>
              <string>${{ secrets.IOS_PROVISION_PROFILE_NAME }}</string>
            </dict>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/GameLabController.xcarchive \
            -exportPath $RUNNER_TEMP/ios-export \
            -exportOptionsPlist $RUNNER_TEMP/ios-export.plist

      # ── Upload to TestFlight ──────────────────────────────────────────────
      - name: Upload iOS to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # altool doesn't accept an arbitrary --private-key path -- it looks
          # for a file named AuthKey_<key ID>.p8 in one of a few fixed
          # directories, so the key has to be placed there under that name.
          mkdir -p ~/private_keys
          echo -n "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8

          xcrun altool --upload-app \
            --type ios \
            --file $RUNNER_TEMP/ios-export/GameLabController.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --show-progress

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true

      - name: Clean up App Store Connect API key
        if: always()
        run: rm -rf ~/private_keys

  # ── Deploy tvOS board app to TestFlight ────────────────────────────────────
  deploy-tvos:
    name: Deploy tvOS → TestFlight
    runs-on: macos-26
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'both' || github.event.inputs.target == 'tvos'))
    defaults:
      run:
        working-directory: ios
    environment: testflight

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # A freshly xcode-select'd non-default Xcode copy may never have run
      # Apple's first-launch initialization (accepting the license,
      # registering with CoreSimulator, etc.). Without it, -downloadPlatform
      # fails with "Unable to connect to simulator" rather than actually
      # downloading anything.
      - name: Run Xcode first launch
        run: sudo xcodebuild -runFirstLaunch

      # This runner image's VM instances aren't always consistent about what
      # platform support is pre-cached (see build-check's tvOS build step for
      # the destination forms that failed with "tvOS ... is not installed" on
      # an earlier Xcode/runner combination). Downloading explicitly here is
      # a no-op when already present and cheap insurance otherwise.
      - name: Install tvOS platform
        run: |
          for attempt in 1 2 3 4 5 6; do
            sudo xcodebuild -downloadPlatform tvOS && exit 0
            echo "Attempt $attempt failed (often a transient CoreSimulator connection race) -- retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Apple Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          # No -t: forcing cert-only import drops the paired private key.
          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install tvOS provisioning profile
        env:
          TVOS_PROVISION_PROFILE_BASE64: ${{ secrets.TVOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/tvos.mobileprovision
          echo -n "$TVOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Set build number
        run: agvtool new-version -all ${{ github.run_number }}

      - name: Archive tvOS app
        env:
          TVOS_PROVISION_PROFILE_NAME: ${{ secrets.TVOS_PROVISION_PROFILE_NAME }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild archive \
            -project GameLab.xcodeproj \
            -scheme GameLabTV \
            -configuration Release \
            -destination generic/platform=tvOS \
            -archivePath $RUNNER_TEMP/GameLabTV.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$TVOS_PROVISION_PROFILE_NAME"

      - name: Export IPA
        env:
          TVOS_PROVISION_PROFILE_NAME: ${{ secrets.TVOS_PROVISION_PROFILE_NAME }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > $RUNNER_TEMP/tvos-export.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.gamelab.tv</key>
              <string>${{ secrets.TVOS_PROVISION_PROFILE_NAME }}</string>
            </dict>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/GameLabTV.xcarchive \
            -exportPath $RUNNER_TEMP/tvos-export \
            -exportOptionsPlist $RUNNER_TEMP/tvos-export.plist

      - name: Upload tvOS to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # altool doesn't accept an arbitrary --private-key path -- it looks
          # for a file named AuthKey_<key ID>.p8 in one of a few fixed
          # directories, so the key has to be placed there under that name.
          mkdir -p ~/private_keys
          echo -n "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8

          xcrun altool --upload-app \
            --type appletvos \
            --file $RUNNER_TEMP/tvos-export/GameLabTV.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --show-progress

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true

      - name: Clean up App Store Connect API key
        if: always()
        run: rm -rf ~/private_keys
