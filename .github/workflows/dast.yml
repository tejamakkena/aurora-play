name: Dynamic scan (OWASP ZAP)

# Starts the server inside the runner and attacks it with OWASP ZAP's baseline
# scan: a spider plus passive checks (missing headers, cookie flags, leaked
# information, outdated JS libraries). It never touches the hosted server, so a
# scan cannot wake, slow or fill Render's free tier.
#
# Runs weekly and on demand. It does not fail the run on findings yet, so the
# first scans can be read and triaged: open the zap-report artifact. Set
# fail_action to true once the report is clean.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Start the server
        env:
          FLASK_DEBUG: "0"
          SECRET_KEY: ci-only-not-a-secret
        run: |
          nohup python app.py > server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:5000/about >/dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
      - name: Server log on failure
        if: failure()
        run: cat server.log
