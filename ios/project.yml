# XcodeGen project spec — generates GameLab.xcodeproj on the fly.
# Run: brew install xcodegen && xcodegen generate  (from ios/ directory)

name: GameLab
options:
  bundleIdPrefix: com.gamelab           # ← CHANGE to your reverse-domain prefix
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  xcodeVersion: "15.4"
  groupSortPosition: top
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

# Swift Package dependencies
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.0.0"

# ─── Targets ──────────────────────────────────────────────────────────────────

targets:

  # ── iPhone / iPad controller app ──────────────────────────────────────────
  GameLabController:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: GameLabController
        excludes: ["*.plist"]
      - path: Shared

    dependencies:
      - package: SocketIO
        product: SocketIO

    # Regenerates Shared/Resources/BuildStamp.json from git before every
    # build, so the in-app "Build <sha>" line always matches the commit the
    # app was built from (see ios/SETUP.md). The script never fails the
    # build (writes commit="dev" when git is unavailable), and dependency
    # analysis is off so the stamp refreshes even on no-op rebuilds.
    # $SRCROOT is ios/ here: the .xcodeproj is generated next to project.yml.
    preBuildScripts:
      - name: Stamp build commit
        script: "$SRCROOT/build-stamp.sh"
        basedOnDependencyAnalysis: false

    info:
      path: GameLabController/Info.plist
      properties:
        CFBundleDisplayName: Aurora Play
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMotionUsageDescription: "Aurora Play uses motion to let you tilt and shake your phone as a game controller."
        NSLocalNetworkUsageDescription: "Aurora Play connects to the game server on your local network."
        # Travel Mode's quizmaster (Views/Travel/TravelVoice.swift) records
        # spoken answers and transcribes them with SFSpeechRecognizer. These
        # must live HERE, not only in Info.plist: CI and `fastlane beta` run
        # `xcodegen generate`, which rewrites Info.plist from this list, so a
        # key added to the plist alone is dropped from the uploaded build
        # (App Store Connect then rejects it with ITMS-90683).
        NSMicrophoneUsageDescription: "Travel Mode's quizmaster listens to your spoken answers through the microphone so it can hear and grade them."
        NSSpeechRecognitionUsageDescription: "Your spoken quiz answers are transcribed on-device so the quizmaster can check them."
        NSBonjourServices:
          - _aurora._tcp
        # Plain http to a LAN host (a laptop running the server at a party).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # auroraplay://join/<CODE> -- opened by the TV lobby's QR code via
        # the /join/<code> web page, and pre-fills the room code.
        CFBundleURLTypes:
          - CFBundleURLName: com.gamelab.controller.join
            CFBundleURLSchemes: [auroraplay]

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamelab.controller   # ← CHANGE
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""        # ← set to your 10-char Team ID
        CODE_SIGN_STYLE: Manual     # overridden to Automatic for local dev (see below)
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_PROVISION_PROFILE_NAME)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""

  # ── Apple TV board app ────────────────────────────────────────────────────
  GameLabTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"

    sources:
      - path: GameLabTV
        excludes: ["*.plist"]
      - path: Shared

    dependencies:
      - package: SocketIO
        product: SocketIO

    # Same build-stamp phase as GameLabController: regenerates
    # Shared/Resources/BuildStamp.json from git before every build.
    preBuildScripts:
      - name: Stamp build commit
        script: "$SRCROOT/build-stamp.sh"
        basedOnDependencyAnalysis: false

    info:
      path: GameLabTV/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "Aurora connects to the game server on your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamelab.tv            # ← CHANGE
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""        # ← set to your 10-char Team ID
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "$(TVOS_PROVISION_PROFILE_NAME)"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""

    # Per-target scheme convenience (see the top-level `Scheme` docs in
    # XcodeGen's ProjectSpec): this augments the normal auto-generated
    # GameLabTV scheme with a test action wired to GameLabTVUITests, rather
    # than replacing it -- build/run/archive on this scheme (used by
    # build-check and deploy-tvos) are untouched.
    scheme:
      testTargets:
        - GameLabTVUITests

  # ── tvOS UI tests ──────────────────────────────────────────────────────────
  # Exists to answer, automatically and in a Simulator, the exact question 15
  # rounds of manual on-device testing were spent chasing: does pressing
  # Select (or Play/Pause) on the Siri Remote actually invoke a game card's
  # action at all. See TVGameSelectionView's debugLastInput diagnostic (now
  # #if DEBUG-only) for the mechanism this reads.
  GameLabTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"

    sources:
      - path: GameLabTVUITests

    dependencies:
      - target: GameLabTV

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamelab.tv.uitests
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
